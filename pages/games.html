<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#26262e">
  <title>Pick your workplace</title>
  <link rel="stylesheet" href="/game/styles.css?v={{v}}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23c2185b%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-size=%2218%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22%3EAI%3C/text%3E%3C/svg%3E">
</head>
<body>
  <main class="game">
    <section class="screen picker">
      <p class="eyebrow">Session 3 · Your workplace</p>
      <h1>Pick your workplace</h1>
      <p class="lede">Choose the job closest to yours. You'll spend a day there helping your manager pick one AI idea, then pitch it to them.</p>
      <ul class="games">
{{list}}
      </ul>
      <p class="small">Use the same phone for the whole game: your progress is saved on it.</p>
    </section>
  </main>
  <script id="looks" type="application/json">{{looks}}</script>
  <script src="/game/art.js?v={{v}}"></script>
  <script>
    // Draw each workplace's manager next to its name.
    const looks = JSON.parse(document.getElementById("looks").textContent);
    document.querySelectorAll(".pick-art").forEach((el) => { el.innerHTML = GameArt.person(looks[el.dataset.key], "happy"); });
  </script>
</body>
</html>
